<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NURS 304 💊 💉 🫀</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KGQEJYSERN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-KGQEJYSERN');
    </script>
  </head>
  <body class="practice-page">
    <header class="topbar">
      <h1>NURS 304 💊 💉 🫀</h1>
      <nav class="topbar-tabs" aria-label="Study tools">
        <a class="topbar-tab active" href="index.html" aria-current="page">Practice questions</a>
        <a class="topbar-tab" href="reference-ranges.html">Reference ranges</a>
      </nav>
    </header>

    <main class="layout">
      <section class="workspace">
        <section class="question-panel" aria-live="polite">
          <div class="question-summary" aria-live="polite">
            <span><strong id="questionsLeftCount">0</strong> questions left</span>
          </div>

          <div id="emptyState" class="empty-state">
            <h2 id="emptyTitle">No matching questions</h2>
            <p id="emptyMessage">Adjust the filters to continue practicing.</p>
          </div>

          <article id="questionCard" class="question-card hidden">
            <div class="question-card-header">
              <h2 id="questionStem"></h2>
            </div>

            <form id="answerForm" class="answers"></form>

            <div class="practice-actions">
              <button id="previousButton" type="button">Previous</button>
              <div class="practice-actions-right">
                <button id="submitButton" type="button" class="hidden">Submit</button>
                <button id="nextButton" type="button">Next</button>
              </div>
            </div>

            <section id="feedback" class="feedback hidden" aria-live="polite"></section>
            <p class="question-disclaimer">Please let me know if any questions are incorrect, worded strangely, or wrongly associated with slides!</p>
          </article>
        </section>

        <aside class="right-sidebar">
          <section class="filters-panel" aria-label="Question filters">
            <div class="panel-heading">
              <h2>Filters</h2>
              <button
                id="filtersToggleButton"
                class="panel-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="filtersContent"
              >
                Show
              </button>
            </div>
            <div id="filtersContent" class="filters hidden">
              <label class="field">
                <span>Week</span>
                <select id="weekFilter"></select>
              </label>

              <label class="field">
                <span>Subtopic</span>
                <select id="subtopicFilter"></select>
              </label>

              <label class="field">
                <span>Source</span>
                <select id="sourceFilter"></select>
              </label>

              <button id="resetAnsweredButton" type="button">Reset answered questions</button>
            </div>
          </section>

          <section class="study-support-panel" aria-label="Relevant slides and definitions">
            <div class="panel-heading">
              <h2>Slides and terms</h2>
              <span id="studySupportStatus">0 slides · 0 terms</span>
            </div>
            <div class="study-support-actions">
              <button id="defineButton" type="button">Show slides and definitions</button>
            </div>
            <div id="slideList" class="slide-list"></div>
            <div id="definitionList" class="definition-list"></div>
          </section>
        </aside>
      </section>
    </main>

    <script src="app.js?v=20260513-videos-removed"></script>
  </body>
</html>
