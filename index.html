<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NURS 304 Quiz Bank</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <h1>NURS 304 Quiz Bank</h1>
    </header>

    <main class="layout">
      <section class="workspace">
        <aside class="filters-panel" aria-label="Question filters">
          <div class="panel-heading">
            <h2>Filters</h2>
          </div>
          <div class="filters">
            <fieldset class="field radio-field">
              <span>Topic</span>
              <div id="topicFilter" class="radio-group"></div>
            </fieldset>

            <fieldset class="field radio-field">
              <span>Category</span>
              <div id="categoryFilter" class="radio-group"></div>
            </fieldset>
          </div>
        </aside>

        <div class="study-area">
          <section class="question-panel" aria-live="polite">
            <div id="emptyState" class="empty-state">
              <h2>No matching questions</h2>
              <p>Adjust the filters to continue practicing.</p>
            </div>

            <article id="questionCard" class="question-card hidden">
              <div class="question-card-header">
                <div>
                  <p id="questionMeta" class="question-meta"></p>
                  <h2 id="questionStem"></h2>
                </div>
                <button id="randomButton" type="button">Random</button>
              </div>

              <form id="answerForm" class="answers"></form>

              <div class="practice-actions">
                <button id="clearButton" type="button">Clear</button>
                <button id="nextButton" type="button">Next</button>
              </div>

              <section id="feedback" class="feedback hidden" aria-live="polite"></section>
            </article>
          </section>

          <aside class="definitions-panel" aria-label="Medical word definitions">
            <div class="panel-heading">
              <h2>Definitions</h2>
              <span id="definitionStatus">0 terms</span>
            </div>
            <div id="definitionList" class="definition-list"></div>
          </aside>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
