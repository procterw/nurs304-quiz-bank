<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NURS 304 Practice Questions 💊 💉 🫀</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <h1>NURS 304 Practice Questions 💊 💉 🫀</h1>
    </header>

    <main class="layout">
      <section class="progress-card" aria-label="Question progress">
        <div class="progress-summary">
          <span id="progressText">0 answered · 0 remaining</span>
          <button id="resetAnsweredButton" type="button">Reset answered questions</button>
        </div>
        <div class="progress-bar" aria-hidden="true">
          <span id="progressUnanswered" class="progress-segment progress-unanswered"></span>
          <span id="progressCorrect" class="progress-segment progress-correct"></span>
          <span id="progressIncorrect" class="progress-segment progress-incorrect"></span>
        </div>
      </section>

      <section class="workspace">
        <section class="question-panel" aria-live="polite">
          <div id="emptyState" class="empty-state">
            <h2 id="emptyTitle">No matching questions</h2>
            <p id="emptyMessage">Adjust the filters to continue practicing.</p>
          </div>

          <article id="questionCard" class="question-card hidden">
            <div class="question-card-header">
              <h2 id="questionStem"></h2>
            </div>

            <form id="answerForm" class="answers"></form>

            <div class="practice-actions">
              <button id="submitButton" type="button" class="hidden">Submit</button>
              <button id="randomButton" type="button" class="icon-button" aria-label="Shuffle question" title="Shuffle question">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M16 3h5v5"></path>
                  <path d="M4 20l6.5-6.5"></path>
                  <path d="M15 9l6-6"></path>
                  <path d="M21 16v5h-5"></path>
                  <path d="M4 4l17 17"></path>
                </svg>
              </button>
            </div>

            <section id="feedback" class="feedback hidden" aria-live="polite"></section>
            <p id="questionMeta" class="question-meta"></p>
          </article>
        </section>

        <aside class="right-sidebar">
          <section class="filters-panel" aria-label="Question filters">
            <div class="panel-heading">
              <h2>Filters</h2>
            </div>
            <div class="filters">
              <label class="field">
                <span>Topic</span>
                <select id="topicFilter"></select>
              </label>

              <label class="field">
                <span>Category</span>
                <select id="categoryFilter"></select>
              </label>
            </div>
          </section>

          <section class="definitions-panel" aria-label="Medical word definitions">
            <div class="panel-heading">
              <h2>Definitions</h2>
              <span id="definitionStatus">0 terms</span>
            </div>
            <div class="definition-actions">
              <button id="defineButton" type="button">Define terms</button>
            </div>
            <div id="definitionList" class="definition-list"></div>
          </section>
        </aside>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
